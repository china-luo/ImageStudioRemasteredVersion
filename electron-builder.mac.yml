# macOS 打包配置（仅用于 Mac 产物；Windows 安装包仍走 scripts/package-windows-installer.ps1）
# 用法见 scripts/package-mac-app.sh
appId: com.chinaluo.imagestudio
productName: 跨境电商图片生成
copyright: Copyright © 2026 china-luo

directories:
  output: release
  buildResources: build

# 复用 npm 已下载的 Electron 运行时，避免 electron-builder 再下载一份
electronDist: node_modules/electron/dist

# 无 Developer ID 证书时做 ad-hoc 签名，否则未签名应用会被 macOS SIGKILL
afterPack: scripts/after-pack-mac.cjs

files:
  - dist/**
  - electron/**
  - build/**

mac:
  category: public.app-category.graphics-design
  icon: build/icon.icns
  artifactName: ${productName}-${version}-${arch}.${ext}
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64

dmg:
  title: 跨境电商图片生成 ${version}
  window:
    width: 540
    height: 380
  contents:
    - x: 130
      y: 190
      type: file
    - x: 410
      y: 190
      type: link
      path: /Applications

# 本机开发默认不签名；正式发布时取消注释并配置证书
# mac:
#   identity: "Developer ID Application: Your Name (TEAMID)"
#   hardenedRuntime: true
#   gatekeeperAssess: false
# afterSign: "scripts/notarize-mac-app.js"
