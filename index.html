<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f5fa" />
    <meta name="color-scheme" content="light dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="跨境Image" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./pwa-icon.png" />
    <link rel="icon" href="./pwa-icon.png" type="image/png" />
    <title>跨境Image工作台</title>
    <script>
      // Apply the saved theme before first paint to avoid a light/dark flash.
      try {
        var t = localStorage.getItem('image-studio-theme')
        if (t === 'dark' || t === 'light') document.documentElement.classList.add(t)
        if (localStorage.getItem('image-studio-nav-collapsed') === '1') document.documentElement.classList.add('nav-collapsed')
      } catch (e) {}
    </script>
  </head>
  <body class="min-h-screen text-gray-900 antialiased dark:text-gray-100">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
