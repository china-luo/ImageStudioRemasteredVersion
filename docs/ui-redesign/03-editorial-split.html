<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>方案 03 · 极简图标轨 + 左右对开工作台与底步条 — 跨境Image工作台</title>
  <style>
    /* ==========================================================================
       Design Tokens -> Tailwind Config 1:1 Mapping Reference
       --------------------------------------------------------------------------
       零顶栏、单一 58px 极简图标轨 + 左右对开工作区（左画板/批量表，右提示词+风格板）+ 底部七步推进条。
       tailwind.config.js -> theme.extend:
       colors: {
         app: 'hsl(var(--bg-app-hsl) / <alpha-value>)',
         surface: 'hsl(var(--bg-surface-hsl) / <alpha-value>)',
         subtle: 'hsl(var(--bg-subtle-hsl) / <alpha-value>)',
         border: 'hsl(var(--border-hsl) / <alpha-value>)',
         foreground: 'hsl(var(--ink-primary-hsl) / <alpha-value>)',
         muted: { foreground: 'hsl(var(--ink-secondary-hsl) / <alpha-value>)' },
         primary: { DEFAULT: 'hsl(var(--accent-hsl) / <alpha-value>)', foreground: 'hsl(var(--accent-fg-hsl) / <alpha-value>)' },
       }
       ========================================================================== */

    :root,
    [data-theme="light"] {
      --bg-app-hsl: 220 18% 97%;
      --bg-surface-hsl: 0 0% 100%;
      --bg-subtle-hsl: 220 16% 94%;
      --bg-hover-hsl: 220 15% 90%;
      --border-hsl: 220 14% 88%;

      --ink-primary-hsl: 222 24% 11%;
      --ink-secondary-hsl: 220 10% 42%;
      --ink-tertiary-hsl: 220 8% 58%;

      --accent-hsl: 221 78% 49%;
      --accent-hover-hsl: 221 82% 42%;
      --accent-soft-hsl: 220 86% 95%;
      --accent-fg-hsl: 0 0% 100%;

      --ok-hsl: 155 58% 34%;
      --run-hsl: 214 82% 48%;
      --warn-hsl: 35 84% 42%;
      --err-hsl: 358 68% 48%;

      --bg-app: hsl(var(--bg-app-hsl));
      --bg-surface: hsl(var(--bg-surface-hsl));
      --bg-subtle: hsl(var(--bg-subtle-hsl));
      --bg-hover: hsl(var(--bg-hover-hsl));
      --border: rgba(17, 22, 34, 0.08);
      --border-strong: rgba(17, 22, 34, 0.16);

      --ink-primary: hsl(var(--ink-primary-hsl));
      --ink-secondary: hsl(var(--ink-secondary-hsl));
      --ink-tertiary: hsl(var(--ink-tertiary-hsl));

      --accent: hsl(var(--accent-hsl));
      --accent-hover: hsl(var(--accent-hover-hsl));
      --accent-soft: hsl(var(--accent-soft-hsl));
      --accent-fg: hsl(var(--accent-fg-hsl));

      --ok: hsl(var(--ok-hsl));
      --run: hsl(var(--run-hsl));
      --warn: hsl(var(--warn-hsl));
      --err: hsl(var(--err-hsl));

      --font-sans: "SF Pro Text", "PingFang SC", "Microsoft YaHei", -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: "SF Mono", ui-monospace, "Cascadia Code", Menlo, Consolas, monospace;

      --text-2xs: 11px;
      --text-xs: 12px;
      --text-sm: 13px;
      --text-lg: 18px;

      --radius-xs: 5px;
      --radius-sm: 7px;
      --radius-md: 10px;
    }

    [data-theme="dark"] {
      --bg-app-hsl: 222 18% 7%;
      --bg-surface-hsl: 222 16% 10.5%;
      --bg-subtle-hsl: 222 14% 14%;
      --bg-hover-hsl: 222 14% 18%;
      --border-hsl: 222 14% 19%;

      --ink-primary-hsl: 220 20% 94%;
      --ink-secondary-hsl: 220 9% 62%;
      --ink-tertiary-hsl: 220 8% 45%;

      --accent-hsl: 216 88% 60%;
      --accent-hover-hsl: 216 92% 66%;
      --accent-soft-hsl: 216 52% 16%;
      --accent-fg-hsl: 222 18% 7%;

      --ok-hsl: 154 54% 52%;
      --run-hsl: 212 88% 64%;
      --warn-hsl: 38 84% 58%;
      --err-hsl: 358 74% 64%;

      --border: rgba(240, 244, 255, 0.08);
      --border-strong: rgba(240, 244, 255, 0.16);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      overflow: hidden;
      font-family: var(--font-sans);
      font-size: var(--text-xs);
      background: var(--bg-app);
      color: var(--ink-primary);
      -webkit-font-smoothing: antialiased;
    }

    button, input, textarea { font-family: inherit; color: inherit; }
    button { border: none; background: transparent; cursor: pointer; }
    .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

    /* ==========================================================================
       Shell: Single 56px Left Icon Strip + Right Split Workspace + Bottom Stepper
       (Zero Top Status Bar! Zero Double Left Sidebar!)
       ========================================================================== */
    .shell {
      display: grid;
      grid-template-columns: 56px minmax(0, 1fr);
      width: 100vw;
      height: 100vh;
    }

    /* 1. Single Quiet Left Icon Strip */
    .rail {
      background: var(--bg-surface);
      border-right: 1px solid var(--border);
      padding: 14px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      z-index: 20;
    }

    .rail-g { display: flex; flex-direction: column; align-items: center; gap: 6px; }

    .rail-logo {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      background: var(--ink-primary);
      color: var(--bg-surface);
      display: grid;
      place-items: center;
      margin-bottom: 12px;
    }

    .rail-sep { width: 20px; height: 1px; background: var(--border); margin: 6px 0; }

    .rail-btn {
      position: relative;
      width: 38px;
      height: 38px;
      border-radius: var(--radius-sm);
      display: grid;
      place-items: center;
      color: var(--ink-secondary);
      transition: background 0.14s, color 0.14s;
    }
    .rail-btn:hover { background: var(--bg-subtle); color: var(--ink-primary); }
    .rail-btn.active { background: var(--accent-soft); color: var(--accent); }
    .rail-btn svg { width: 17px; height: 17px; stroke-width: 1.65; }

    .rail-btn::after {
      content: attr(data-tip);
      position: absolute;
      left: 48px;
      top: 50%;
      transform: translateY(-50%) translateX(-4px);
      background: var(--ink-primary);
      color: var(--bg-surface);
      padding: 4px 9px;
      border-radius: var(--radius-xs);
      font-size: 11px;
      font-weight: 500;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.14s, transform 0.14s;
      z-index: 60;
    }
    .rail-btn:hover::after { opacity: 1; transform: translateY(-50%) translateX(0); }

    /* 2. Right Body: Split Studio Above + Bottom 7-Step Flow Bar */
    .right-shell {
      display: grid;
      grid-template-rows: minmax(0, 1fr) 54px;
      min-width: 0;
      min-height: 0;
    }

    .split-main {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 372px;
      min-height: 0;
      min-width: 0;
    }

    /* Left Gallery / Batch Table Stage (Opens directly at top, ZERO top bar!) */
    .stage-left {
      overflow-y: auto;
      padding: 24px 28px 24px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .stage-title-row {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    .stage-h1 {
      font-size: var(--text-lg);
      font-weight: 600;
      letter-spacing: -0.02em;
      line-height: 1.25;
    }

    .stage-meta {
      font-size: var(--text-xs);
      color: var(--ink-tertiary);
      margin-top: 3px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .stage-tools {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .seg {
      display: inline-flex;
      padding: 2px;
      border-radius: var(--radius-sm);
      background: var(--bg-subtle);
      border: 1px solid var(--border);
    }
    .seg-b {
      height: 26px;
      padding: 0 10px;
      border-radius: 5px;
      font-size: 11.5px;
      color: var(--ink-secondary);
      font-weight: 500;
    }
    .seg-b.active { background: var(--bg-surface); color: var(--ink-primary); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }

    /* Visual Matrix */
    .matrix {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
    }

    .tile {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: border-color 0.14s, transform 0.16s;
      cursor: pointer;
    }
    .tile:hover { border-color: var(--border-strong); transform: translateY(-1px); }
    .tile.selected { border-color: var(--accent); box-shadow: 0 0 0 1.5px var(--accent); }

    .tile-art {
      aspect-ratio: 1 / 1;
      width: 100%;
      background: var(--bg-app);
      position: relative;
    }
    .tile-art canvas { width: 100%; height: 100%; display: block; }

    .tile-chk {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 16px;
      height: 16px;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .tile-meta {
      padding: 9px 11px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      border-top: 1px solid var(--border);
    }

    .tm-l { display: flex; align-items: baseline; gap: 6px; min-width: 0; }
    .tm-code { font-family: var(--font-mono); font-weight: 700; font-size: 11px; color: var(--ink-tertiary); }
    .tm-title { font-size: var(--text-xs); font-weight: 600; color: var(--ink-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .st-ind { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; color: var(--ink-secondary); white-space: nowrap; flex-shrink: 0; }
    .dot { width: 6px; height: 6px; border-radius: 50%; }
    .dot.done { background: var(--ok); }
    .dot.running { background: var(--run); }
    .dot.review { background: var(--warn); }
    .dot.failed { background: var(--err); }
    .st-ind.failed { color: var(--err); font-weight: 600; }
    .st-ind.review { color: var(--warn); font-weight: 600; }
    .st-ind.running { color: var(--run); font-weight: 600; }

    /* Batch Proofread Table */
    .tbl-wrap {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      overflow-x: auto;
    }
    table.ops { width: 100%; border-collapse: collapse; }
    .ops th {
      text-align: left;
      padding: 9px 10px;
      font-size: 11px;
      font-weight: 600;
      color: var(--ink-tertiary);
      border-bottom: 1px solid var(--border);
      background: var(--bg-subtle);
      white-space: nowrap;
    }
    .ops td { padding: 9px 10px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    .ops tr:last-child td { border-bottom: none; }
    .tbl-thumb { width: 52px; height: 52px; border-radius: 5px; overflow: hidden; border: 1px solid var(--border); }
    .tbl-thumb canvas { width: 100%; height: 100%; display: block; }
    .inline-ta {
      width: 100%;
      min-width: 240px;
      min-height: 48px;
      padding: 6px 8px;
      border-radius: 5px;
      border: 1px solid transparent;
      background: transparent;
      font-size: 11.5px;
      line-height: 1.45;
      resize: vertical;
    }
    .inline-ta:hover { border-color: var(--border); background: var(--bg-app); }
    .inline-ta:focus { outline: none; border-color: var(--accent); background: var(--bg-surface); }

    /* Right Editorial Control Panel (Slot Prompt + Style Board) */
    .right-panel {
      background: var(--bg-surface);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow-y: auto;
    }

    .rp-section {
      padding: 18px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .rp-section:last-child { border-bottom: none; }

    .rp-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .rp-title { font-size: var(--text-sm); font-weight: 600; color: var(--ink-primary); }
    .rp-sub { font-size: 11px; color: var(--ink-tertiary); }

    .preview-strip {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px;
      border-radius: var(--radius-sm);
      background: var(--bg-app);
      border: 1px solid var(--border);
    }

    .preview-mini {
      width: 58px;
      height: 58px;
      border-radius: 5px;
      overflow: hidden;
      border: 1px solid var(--border);
      flex-shrink: 0;
    }
    .preview-mini canvas { width: 100%; height: 100%; display: block; }

    .prompt-area {
      width: 100%;
      min-height: 110px;
      padding: 10px 11px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-strong);
      background: var(--bg-app);
      font-size: var(--text-xs);
      line-height: 1.55;
      resize: vertical;
    }
    .prompt-area:focus { outline: none; border-color: var(--accent); background: var(--bg-surface); }

    .diag {
      padding: 9px 10px;
      border-radius: var(--radius-xs);
      font-size: 11.5px;
      line-height: 1.48;
      border: 1px solid var(--border);
      background: var(--bg-app);
    }
    .diag.err { color: var(--err); border-color: hsl(var(--err-hsl) / 0.34); }
    .diag.warn { color: var(--warn); border-color: hsl(var(--warn-hsl) / 0.34); }

    .btn {
      height: 32px;
      padding: 0 13px;
      border-radius: var(--radius-sm);
      font-size: var(--text-xs);
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      white-space: nowrap;
    }
    .btn-primary { background: var(--accent); color: var(--accent-fg); font-weight: 600; }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-ghost { background: var(--bg-surface); border: 1px solid var(--border); color: var(--ink-primary); }
    .btn-ghost:hover { background: var(--bg-subtle); border-color: var(--border-strong); }

    /* Style Board 2x2 Inside Right Panel */
    .style-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .st-tile {
      padding: 9px 10px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--bg-app);
      text-align: left;
      display: flex;
      flex-direction: column;
      gap: 6px;
      transition: border-color 0.14s, background 0.14s;
    }
    .st-tile:hover { border-color: var(--border-strong); }
    .st-tile.active { border-color: var(--accent); background: var(--bg-surface); box-shadow: 0 0 0 1px var(--accent); }

    .sw-bar { display: flex; gap: 2px; height: 9px; }
    .sw-bar span { flex: 1; border-radius: 2px; }
    .st-name { font-size: 11.5px; font-weight: 600; color: var(--ink-primary); }
    .st-sub { font-size: 10px; color: var(--ink-tertiary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* ==========================================================================
       Bottom Anchored 7-Step Flow Progression Bar (Clean, Natural, Ergonomic)
       ========================================================================== */
    .bottom-flow {
      background: var(--bg-surface);
      border-top: 1px solid var(--border);
      padding: 0 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .step-line {
      display: flex;
      align-items: center;
      gap: 4px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .step-line::-webkit-scrollbar { display: none; }

    .bf-step {
      height: 30px;
      padding: 0 9px;
      border-radius: var(--radius-xs);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11.5px;
      color: var(--ink-secondary);
      white-space: nowrap;
    }
    .bf-step:hover { background: var(--bg-subtle); color: var(--ink-primary); }
    .bf-step.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }

    .bf-arrow { color: var(--ink-tertiary); opacity: 0.45; font-size: 11px; }

    .bf-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .toast {
      position: fixed;
      top: 18px;
      right: 22px;
      background: var(--ink-primary);
      color: var(--bg-surface);
      padding: 8px 14px;
      border-radius: var(--radius-sm);
      font-size: var(--text-xs);
      font-weight: 500;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.16s;
      z-index: 90;
    }
    .toast.show { opacity: 1; }

    @media (max-width: 1180px) { .matrix { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (max-width: 860px) {
      .split-main { grid-template-columns: 1fr; }
      .right-panel { display: none; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <!-- 1. Single Quiet Left Icon Strip (No Second Sidebar!) -->
    <aside class="rail" aria-label="功能模块">
      <div class="rail-g">
        <div class="rail-logo" title="跨境Image工作台">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="2" width="12" height="12" rx="2.5"/><circle cx="8" cy="8" r="2.5"/></svg>
        </div>
        <button class="rail-btn active" data-mod="Listing" data-tip="Listing 套图">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="3" width="7" height="7" rx="1.2"/><rect x="14" y="3" width="7" height="7" rx="1.2"/><rect x="3" y="14" width="7" height="7" rx="1.2"/><rect x="14" y="14" width="7" height="7" rx="1.2"/></svg>
        </button>
        <button class="rail-btn" data-mod="A+" data-tip="A+ 页面">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="4" width="18" height="6" rx="1.2"/><rect x="3" y="13" width="8" height="7" rx="1.2"/><rect x="13" y="13" width="8" height="7" rx="1.2"/></svg>
        </button>
        <button class="rail-btn" data-mod="TikTok" data-tip="TikTok 竖屏">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="6" y="2.5" width="12" height="19" rx="2"/><line x1="10" y1="18" x2="14" y2="18"/></svg>
        </button>
        <div class="rail-sep"></div>
        <button class="rail-btn" data-mod="拆图反推" data-tip="拆图反推">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>
        </button>
        <button class="rail-btn" data-mod="VOC" data-tip="VOC 评论洞察">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        </button>
      </div>

      <div class="rail-g">
        <button class="rail-btn" data-mod="历史交付" data-tip="历史交付">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15 15"/></svg>
        </button>
        <button class="rail-btn" data-mod="设置" data-tip="本地与引擎设置">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
        <button class="rail-btn" id="themeBtn" data-tip="切换亮色/暗色">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
        </button>
      </div>
    </aside>

    <!-- 2. Main Split Workspace + Bottom 7-Step Flow Bar -->
    <div class="right-shell">
      <div class="split-main">
        <!-- Left Open Artboard / Batch Table Stage -->
        <main class="stage-left">
          <div class="stage-title-row">
            <div>
              <h1 class="stage-h1">Kettlo Pro 温控手冲咖啡壶</h1>
              <div class="stage-meta mono">
                <span>美亚 US · KT-900-BLK · B0D9K4M7X2</span>
                <span>·</span>
                <span style="color:var(--ok)">● 本地优先 1.8 GB</span>
              </div>
            </div>
            <div class="stage-tools">

    function roundRect(ctx, x, y, w, h, r) {

    function drawKettle(ctx, cx, cy, scale, styleObj, opts = {}) {
      ctx.save(); ctx.translate(cx, cy); ctx.scale(scale, scale);

      ctx.beginPath();

    function renderCanvas(canvas, slot, styleObj) {
      const ctx = canvas.getContext('2d');
      const W = canvas.width, H = canvas.height;
      ctx.clearRect(0, 0, W, H);

        roundRect(ctx, W*0.10, H*0.80, W*0.18, H*0.13, 14); ctx.fill(); ctx.stroke();
        ctx.fillStyle = 'rgba(130, 62, 24, 0.78)'; roundRect(ctx, W*0.11, H*0.855, W*0.16, H*0.068, 8); ctx.fill();

          const y = Math.round(H * (1 - pct/100));

      if (slot.id === 'PT03') {

          roundRect(ctx, W*0.13, H*0.39, W*0.74, H*0.22, 10); ctx.fill();

          ctx.textAlign = 'center'; ctx.fillText('排版安全区越界 · ERR_422', W*0.5, H*0.49);
          ctx.fillStyle = isObsidian ? 'rgba(240,236,234,0.62)' : 'rgba(40,36,34,0.6)';
          ctx.font = `400 ${Math.round(W*0.022)}px "PingFang SC", sans-serif`;
          ctx.fillText('请在右侧一键修复重试', W*0.5, H*0.555);
        }
        return;
      }
      const bg = ctx.createLinearGradient(0, 0, W, H);
      bg.addColorStop(0, styleObj.backdrop[0]); bg.addColorStop(1, styleObj.backdrop[1]);
      ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = isObsidian ? '#191B1F' : '#DFD6C7'; ctx.fillRect(0, H*0.72, W, H*0.28);
      const boxG = ctx.createLinearGradient(W*0.61, H*0.30, W*0.90, H*0.74);
      boxG.addColorStop(0, '#27272B'); boxG.addColorStop(1, '#141417');
      ctx.fillStyle = boxG; roundRect(ctx, W*0.61, H*0.30, W*0.29, H*0.44, 6); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.12)'; ctx.fillRect(W*0.61, H*0.40, W*0.29, 1.5);
      ctx.fillStyle = styleObj.accent; ctx.font = `600 ${Math.round(W*0.022)}px sans-serif`;
      ctx.textAlign = 'center'; ctx.fillText('K E T T L O', W*0.755, H*0.54);
      drawKettle(ctx, W*0.38, H*0.54, W/640, styleObj, { showBase: true, darkBg: isObsidian });
    }

    function renderStyles() {
      const g = document.getElementById('styleGrid');
      g.innerHTML = STYLES.map(s => `
        <button class="st-tile ${s.id === activeStyleId ? 'active' : ''}" data-s="${s.id}">
          <div class="sw-bar">${s.swatches.map(c => `<span style="background:${c}"></span>`).join('')}</div>
          <div class="st-name">${s.name}</div>
          <div class="st-sub">${s.sub}</div>
        </button>
      `).join('');
      g.querySelectorAll('.st-tile').forEach(b => {
        b.addEventListener('click', () => { activeStyleId = b.dataset.s; renderAll(); showToast(`风格板已切换：${getStyle().name}`); });
      });
    }

    function renderStage() {
      const body = document.getElementById('stageBody');
      const st = getStyle();
      if (mode === 'matrix') {
        body.innerHTML = `
          <div class="matrix">
            ${SLOTS.map(slot => `
              <article class="tile ${slot.id === selectedId ? 'selected' : ''}" data-id="${slot.id}">
                <div class="tile-art">
                  <canvas width="480" height="480" data-cv="${slot.id}"></canvas>
                  <input type="checkbox" class="tile-chk" ${slot.checked ? 'checked' : ''} data-chk="${slot.id}" />
                </div>
                <div class="tile-meta">
                  <div class="tm-l"><span class="tm-code">${slot.code}</span><span class="tm-title">${slot.title}</span></div>
                  <span class="st-ind ${slot.status}"><span class="dot ${slot.status}"></span>${slot.statusText}</span>
                </div>
              </article>
            `).join('')}
          </div>
        `;
      } else {
        body.innerHTML = `
          <div class="tbl-wrap">
            <table class="ops">
              <thead>
                <tr>
                  <th style="width:32px;">选</th>
                  <th style="width:68px;">预览</th>
                  <th style="width:128px;">坑位</th>
                  <th style="width:88px;">状态</th>
                  <th>中文策划提示词（行内直改）</th>
                </tr>
              </thead>
              <tbody>
                ${SLOTS.map(slot => `
                  <tr data-id="${slot.id}">
                    <td><input type="checkbox" ${slot.checked ? 'checked' : ''} data-chk="${slot.id}" /></td>
                    <td><div class="tbl-thumb"><canvas width="110" height="110" data-cv="${slot.id}"></canvas></div></td>
                    <td>
                      <div class="mono" style="font-weight:700;">${slot.code}</div>
                      <div style="font-size:11px;color:var(--ink-secondary);margin-top:2px;">${slot.title}</div>
                    </td>
                    <td><span class="st-ind ${slot.status}"><span class="dot ${slot.status}"></span>${slot.statusText}</span></td>
                    <td><textarea class="inline-ta" data-ta="${slot.id}">${slot.prompt}</textarea></td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        `;
      }

      body.querySelectorAll('canvas[data-cv]').forEach(c => renderCanvas(c, getSlot(c.dataset.cv), st));
      body.querySelectorAll('.tile, tr[data-id]').forEach(el => {
        el.addEventListener('click', (e) => {
          if (e.target.matches('input, textarea')) return;
          selectedId = el.dataset.id;
          renderAll();
        });
      });
      body.querySelectorAll('[data-chk]').forEach(chk => {
        chk.addEventListener('change', () => { getSlot(chk.dataset.chk).checked = chk.checked; });
      });
      body.querySelectorAll('[data-ta]').forEach(ta => {
        ta.addEventListener('input', () => { getSlot(ta.dataset.ta).prompt = ta.value; });
      });
    }

    function renderRight() {
      const s = getSlot();
      const st = getStyle();
      const done = SLOTS.filter(x => x.status === 'done').length;
      const rev = SLOTS.filter(x => x.status === 'review').length;
      const fail = SLOTS.filter(x => x.status === 'failed').length;
      document.getElementById('exportBtn').textContent = `打包交付 (${done}/7)`;
      document.getElementById('bfDot4').className = `dot ${rev ? 'review' : 'done'}`;
      document.getElementById('nextBtn').textContent = (rev + fail) ? `一键处理待办 (${rev + fail})` : '进入定稿交付';

      document.getElementById('rCode').textContent = s.code;
      document.getElementById('rName').textContent = s.title;
      document.getElementById('rMeta').textContent = `2000 × 2000 · ${s.ver} · ${s.seed}`;
      const rst = document.getElementById('rStatus');
      rst.className = `st-ind ${s.status}`;
      rst.innerHTML = `<span class="dot ${s.status}"></span>${s.statusText}`;
      document.getElementById('rPrompt').value = s.prompt;
      renderCanvas(document.getElementById('miniCv'), s, st);

      const diag = document.getElementById('rDiag');
      const runBtn = document.getElementById('rRunBtn');
      if (s.status === 'failed') {
        diag.style.display = 'block'; diag.className = 'diag err'; diag.textContent = s.error;
        runBtn.textContent = '自动收紧边距并重试';
      } else if (s.status === 'review') {
        diag.style.display = 'block'; diag.className = 'diag warn'; diag.textContent = 'AI 策划已完成本坑位结构提示词，核对无误后即可生成。';
        runBtn.textContent = '通过校对并生成';
      } else {
        diag.style.display = 'none';
        runBtn.textContent = '按当前提示词重绘';
      }
    }

    function retrySlot(id) {
      const s = getSlot(id);
      s.status = 'running'; s.progress = 26; s.eta = '剩 20s'; s.statusText = '生成中 26%'; s.ver = 'v2';
    }
    function approveSlot(id) {
      const s = getSlot(id);
      s.status = 'running'; s.progress = 20; s.eta = '剩 22s'; s.statusText = '生成中 20%'; s.ver = 'v1';
    }

    function renderAll() { renderStyles(); renderStage(); renderRight(); }

    document.getElementById('viewSeg').addEventListener('click', (e) => {
      const b = e.target.closest('.seg-b'); if (!b) return;
      mode = b.dataset.m;
      document.querySelectorAll('#viewSeg .seg-b').forEach(el => el.classList.toggle('active', el === b));
      renderStage();
    });
    document.getElementById('rSaveBtn').addEventListener('click', () => {
      getSlot().prompt = document.getElementById('rPrompt').value;
      renderStage(); showToast(`${selectedId} 提示词已保存至本地库`);
    });
    document.getElementById('rRunBtn').addEventListener('click', () => {
      const s = getSlot(); s.prompt = document.getElementById('rPrompt').value;
      if (s.status === 'failed') { retrySlot(s.id); showToast(`${s.code} 已修正边距并重试`); }
      else if (s.status === 'review') { approveSlot(s.id); showToast(`${s.code} 校对通过并开始生成`); }
      else { s.status = 'running'; s.progress = 30; s.eta = '剩 18s'; s.statusText = '生成中 30%'; showToast(`${s.code} 已提交重绘`); }
      renderAll();
    });
    document.getElementById('nextBtn').addEventListener('click', () => {
      let n = 0;
      SLOTS.forEach(s => {
        if (s.status === 'review') { approveSlot(s.id); n++; }
        else if (s.status === 'failed') { retrySlot(s.id); n++; }
      });
      renderAll();
      showToast(n ? `已一键处理 ${n} 项待办（通过 PT03 并重试 PT05）` : '全部坑位就绪，可定稿交付');
    });
    document.getElementById('tickBtn').addEventListener('click', () => {
      let moved = false;
      SLOTS.forEach(s => {
        if (s.status === 'running') {
          s.progress = Math.min(100, (s.progress || 50) + 35);
          if (s.progress >= 100) { s.status = 'done'; s.statusText = '已生成'; s.checked = true; }
          else { s.statusText = `生成中 ${s.progress}%`; s.eta = `剩 ${Math.max(3, Math.round((100-s.progress)/4))}s`; }
          moved = true;
        }
      });
      renderAll(); showToast(moved ? '渲染队列进度已更新' : '队列已全部完成');
    });
    document.getElementById('exportBtn').addEventListener('click', () => {
      const n = SLOTS.filter(s => s.checked && s.status === 'done').length;
      showToast(`正在导出已勾选的 ${n} 张 Amazon 规范套图`);
    });
    document.getElementById('themeBtn').addEventListener('click', () => {
      const h = document.documentElement;
      h.setAttribute('data-theme', h.getAttribute('data-theme') === 'light' ? 'dark' : 'light');
    });
    document.querySelectorAll('.rail-btn[data-mod]').forEach(b => {
      b.addEventListener('click', () => {
        document.querySelectorAll('.rail-btn[data-mod]').forEach(el => el.classList.toggle('active', el === b));
        showToast(`已切换模块：${b.dataset.mod}`);
      });
    });
    document.querySelectorAll('#stepLine .bf-step').forEach(b => {
      b.addEventListener('click', () => {
        document.querySelectorAll('#stepLine .bf-step').forEach(el => el.classList.remove('active'));
        b.classList.add('active');
        if (b.dataset.s === '4') {
          mode = 'table';
          document.querySelectorAll('#viewSeg .seg-b').forEach(el => el.classList.toggle('active', el.dataset.m === 'table'));
          renderStage();
          showToast('已切换至「第 4 步：批量校对提示词」表视图');
        } else showToast(`当前聚焦阶段：第 ${b.dataset.s} 步`);
      });
    });

    renderAll();
  </script>
</body>
</html>
